<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La multa de los 17 años</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <!-- ESCENA 1 -->
        <section id="office">

            <div class="wall"></div>
            <div class="floor"></div>

            <div class="desk">
                <div class="desk-top"></div>
                <div class="desk-front"></div>
            </div>

            <div id="pig">

                <div class="pig-ear left"></div>
                <div class="pig-ear right"></div>

                <div class="pig-head">
                    <div class="pig-eye left-eye"></div>
                    <div class="pig-eye right-eye"></div>

                    <div class="pig-snout">
                        <div class="nostril left-nostril"></div>
                        <div class="nostril right-nostril"></div>
                    </div>
                </div>

                <div class="pig-body"></div>

                <div class="suit">
                    <div class="shirt"></div>
                    <div class="tie"></div>
                </div>

                <div class="pig-arm left-arm"></div>
                <div class="pig-arm right-arm"></div>

                <div id="lipstick">
                    <div class="lipstick-cap"></div>
                    <div class="lipstick-stick"></div>
                    <div class="lipstick-color"></div>
                </div>

                <div id="kiss">💋</div>

            </div>

            <!-- PUERTA SECRETA -->
            <div id="secret-door">
                <div class="door-handle"></div>
                <div class="door-sign">PASAR</div>
            </div>

            <div id="dialogue">
                <p id="dialogue-text"></p>
            </div>

        </section>


        <!-- ESCENA 2 -->
        <!-- ESCENA 2 -->
<section id="secret-room">

    <div class="room-wall"></div>
    <div class="room-floor"></div>

    <!-- VENTANA -->
    <div class="pixel-window">
        <div class="moon">☾</div>
        <div class="stars">✦　·　✦　　·　✧　✦</div>
    </div>

    <!-- CAMA -->
    <div class="bed">
        <div class="bed-head"></div>
        <div class="bed-mattress"></div>
        <div class="bed-pillow"></div>
        <div class="bed-blanket"></div>
    </div>

    <!-- MESA -->
    <div class="room-table">
        <div class="table-top"></div>
        <div class="table-leg left"></div>
        <div class="table-leg right"></div>
    </div>

    <!-- PELUCHE DE ZORRA -->
    <button class="room-object fox" data-message="Un pequeño recordatorio de alguien que te quiere muchísimo.">
        🦊
    </button>

    <!-- TULIPANES -->
    <button class="room-object tulips" data-message="Te amo muchote.">
        🌷
    </button>

    <!-- VELAS ROSAS -->
    <button class="room-object candles" data-message="Un poquito de luz para alguien muy especial.">
        🕯️
    </button>

    <!-- CUCHARAS -->
    <button class="room-object spoons" data-message="Cucharas. Porque sí. :3">
        🥄
    </button>

    <!-- REGALO -->
    <button class="room-object gift" data-message="Todavía quedan sorpresas por descubrir.">
        🎁
    </button>

    <!-- MENSAJE DE OBJETO -->
    <div id="object-message"></div>

    <!-- PARED FINAL -->
    <div id="brick-door">

        <div class="brick-wall">

            <div class="brick-text">
                HAPPY<br>
                HAPPY<br>
                AMOR :3
            </div>

        </div>

    </div>

    <div class="room-title">
        Una pequeña sorpresa...
    </div>

</section>
    </main>

    <script src="script.js"></script>

</body>
</html>
